defaults:
  - baseline_scan
  - _self_

experiment_name: smoke_baseline
device: cpu

data:
  source: synthetic
  batch_size: 8
  synthetic_train_size: 64
  synthetic_val_size: 16

model:
  d_model: 32
  n_heads: 2
  n_enc_layers: 2
  n_dec_layers: 2

trainer:
  max_steps: 20
  log_every: 5
  eval_every: 20
  save_every: 1000000
  warmup_steps: 5
